<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi Niña 🌻</title>
    
    <!-- Fuente que imita la escritura a mano -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Three.js y OrbitControls desde CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            font-family: 'Caveat', cursive;
            overflow: hidden;
        }

        /* --- PANTALLA DE INICIO --- */
        #intro-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            transition: opacity 1.5s ease-in-out;
            cursor: pointer;
        }

        .intro-flower {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 30px rgba(255, 215, 0, 0.8));
            animation: pulseGlow 2s infinite alternate;
        }

        .intro-text {
            color: #FFF2A8;
            font-size: 2.2rem;
            letter-spacing: 2px;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5)) scale(1); }
            100% { filter: drop-shadow(0 0 40px rgba(255, 215, 0, 1)) scale(1.05); }
        }

        /* --- CONTENEDORES 3D Y UI --- */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* --- TEXTOS FLOTANTES --- */
        .floating-label {
            position: absolute;
            color: rgba(255, 250, 200, 0.9);
            font-family: 'Caveat', cursive;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease-out;
            pointer-events: auto;
            cursor: default;
        }

        .label-main {
            font-size: 3.5rem;
            color: #FFE066;
            text-shadow: 0 0 15px rgba(255, 150, 0, 0.8);
            font-weight: 700;
            z-index: 100;
        }

        .label-medium {
            font-size: 2rem;
            color: #FFF9D2;
            text-shadow: 0 0 8px rgba(200, 150, 0, 0.5);
        }

        .label-small {
            font-size: 1.4rem;
            color: #E6E0C8;
            opacity: 0.85;
        }

        /* --- FOTOS FLOTANTES --- */
        .photo-wrapper {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease-out;
            pointer-events: auto;
            z-index: 50;
        }

        .photo-wrapper img {
            width: 200px; /* Tamaño un poco más ajustado para que quepan 3 */
            height: auto;
            border: 8px solid white;
            border-bottom: 25px solid white; /* Efecto Polaroid */
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8), 0 0 20px rgba(255, 215, 0, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s;
            cursor: pointer;
        }

        .photo-wrapper img:hover {
            transform: scale(1.2) rotate(0deg) !important;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 40px rgba(255, 215, 0, 0.8);
            z-index: 200;
        }

        /* --- FLORES Y RAMOS FLOTANTES --- */
        .floating-icon {
            position: absolute;
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease-out, transform 0.3s ease;
            pointer-events: auto;
            cursor: pointer;
            filter: drop-shadow(0 0 10px rgba(255, 200, 0, 0.4));
        }

        .floating-icon:hover {
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.9));
        }

        /* --- BOTÓN DE MÚSICA --- */
        #music-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(255, 215, 0, 0.5);
            color: #FFD700;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 1000;
            font-size: 24px;
            transition: all 0.3s;
        }

        #music-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: scale(1.1);
        }

        /* Mensajes al hacer click */
        .toast {
            position: absolute;
            background: rgba(20, 20, 20, 0.9);
            border: 1px solid #FFD700;
            color: #FFF2A8;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 1.5rem;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 500;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.3);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, -100%) scale(1);
        }

        /* --- MENSAJE SECRETO --- */
        #secret-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        .secret-text {
            color: #FFE066;
            font-size: 3rem;
            text-align: center;
            opacity: 0;
            position: absolute;
            transition: opacity 1.5s ease;
            padding: 0 20px;
            text-shadow: 0 0 20px rgba(255, 200, 0, 0.6);
        }

        @media (max-width: 600px) {
            .secret-text { font-size: 2rem; }
            .label-main { font-size: 2.5rem; }
            .photo-wrapper img { width: 140px; }
        }

    </style>
</head>
<body>

    <!-- Audio Local - Para Aleja -->
    <audio id="bg-music" loop preload="auto">
        <source src="dandelions.mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla de Inicio -->
    <div id="intro-screen">
        <svg class="intro-flower" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <g id="flower">
                <path d="M50 60 Q50 90 50 100" stroke="#5C8C46" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M50 85 Q35 90 30 75 Q45 70 50 85" fill="#5C8C46"/>
                <path d="M50 75 Q65 80 70 65 Q55 60 50 75" fill="#5C8C46"/>
                <g fill="#F2A900">
                    <circle cx="50" cy="20" r="8"/> <circle cx="50" cy="80" r="8"/>
                    <circle cx="20" cy="50" r="8"/> <circle cx="80" cy="50" r="8"/>
                    <circle cx="28" cy="28" r="8"/> <circle cx="72" cy="72" r="8"/>
                    <circle cx="28" cy="72" r="8"/> <circle cx="72" cy="28" r="8"/>
                </g>
                <g fill="#FFD700">
                    <circle cx="50" cy="25" r="8"/> <circle cx="50" cy="75" r="8"/>
                    <circle cx="25" cy="50" r="8"/> <circle cx="75" cy="50" r="8"/>
                    <circle cx="32" cy="32" r="8"/> <circle cx="68" cy="68" r="8"/>
                    <circle cx="32" cy="68" r="8"/> <circle cx="68" cy="32" r="8"/>
                </g>
                <circle cx="50" cy="50" r="18" fill="#4A3018"/>
                <circle cx="50" cy="50" r="14" fill="#3B2411" stroke="#5D3A1F" stroke-width="2" stroke-dasharray="2,2"/>
                <path d="M40 40 L60 60 M40 60 L60 40 M50 35 L50 65 M35 50 L65 50" stroke="#2A170A" stroke-width="1" opacity="0.5"/>
            </g>
        </svg>
        <div class="intro-text">Toca para iniciar</div>
    </div>

    <!-- Contenedores -->
    <div id="canvas-container"></div>
    <div id="labels-container"></div>
    <button id="music-btn">🎵</button>
    <div id="toast-message" class="toast"></div>

    <!-- Pantalla de Mensaje Secreto -->
    <div id="secret-overlay">
        <div class="secret-text" id="sec-1">Si llegaste hasta aquí...</div>
        <div class="secret-text" id="sec-2">Solo quería recordarte algo, Aleja, mi niña.</div>
        <div class="secret-text" id="sec-3">No importa la distancia, siempre habrá una flor amarilla que me recuerde a ti. 🌻</div>
        <div class="secret-text" id="sec-4">Te quiero mucho y eres una persona muy especial para mí. ❤️</div>
    </div>

    <script>
        // Variables de Música e Interacción
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        const introScreen = document.getElementById('intro-screen');
        let isStarted = false;
        let isMusicPlaying = false;
        let secretFound = false;

        // --- CONFIGURACIÓN THREE.JS ---
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.z = 100;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enablePan = false;
        controls.enableZoom = true;
        controls.minDistance = 50;
        controls.maxDistance = 200;
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- ELEMENTOS DE LA ESCENA ---

        // 1. El Planeta Negro
        const planetGeo = new THREE.SphereGeometry(18, 64, 64);
        const planetMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        scene.add(planet);

        // 2. El Anillo Brillante
        function createRingTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const center = 256;

            const gradient = ctx.createRadialGradient(center, center, 100, center, center, 256);
            gradient.addColorStop(0.0, 'rgba(255, 255, 255, 1)');     
            gradient.addColorStop(0.2, 'rgba(255, 230, 100, 0.9)');   
            gradient.addColorStop(0.4, 'rgba(255, 170, 0, 0.8)');     
            gradient.addColorStop(0.7, 'rgba(150, 70, 0, 0.4)');      
            gradient.addColorStop(1.0, 'rgba(0, 0, 0, 0)');           

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 512, 512);

            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.beginPath(); ctx.arc(center, center, 150, 0, Math.PI*2); ctx.stroke();
            ctx.beginPath(); ctx.arc(center, center, 190, 0, Math.PI*2); ctx.stroke();
            ctx.strokeStyle = 'rgba(255, 200, 0, 0.1)';
            ctx.lineWidth = 5;
            ctx.beginPath(); ctx.arc(center, center, 220, 0, Math.PI*2); ctx.stroke();

            return new THREE.CanvasTexture(canvas);
        }

        const ringTexture = createRingTexture();
        const ringGeo = new THREE.PlaneGeometry(80, 80);
        const ringMat = new THREE.MeshBasicMaterial({
            map: ringTexture,
            transparent: true,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 1.7; 
        scene.add(ring);

        // 3. Estrellas
        function createStars() {
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 1500;
            const posArray = new Float32Array(starsCount * 3);
            for(let i = 0; i < starsCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 600;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starsMat = new THREE.PointsMaterial({
                size: 1.5,
                color: 0xFFFFFF,
                transparent: true,
                opacity: 0.8
            });
            return new THREE.Points(starsGeo, starsMat);
        }
        scene.add(createStars());

        // --- TEXTOS ROMÁNTICOS PARA ALEJA ---
        const texts = [
            { text: "Para Aleja, mi niña 🌻", type: "main", pos: [0, 30, 0] },
            { text: "Att: Daniel ❤️", type: "main", pos: [0, -35, 30] },
            
            { text: "Aunque esté lejos, estas flores viajan hasta ti", type: "medium", pos: [-35, -10, 15] },
            { text: "Quería regalarte flores, pero la distancia no me dejó", type: "medium", pos: [0, -30, 20] },
            { text: "Así que hice mi propio jardín para ti", type: "medium", pos: [35, 5, -15] },
            { text: "Que nunca te falten razones para sonreír", type: "medium", pos: [40, -15, 10] },
            { text: "Tu sonrisa merece un universo entero", type: "medium", pos: [-25, -25, -10] },
            { text: "Hay personas que hacen bonito cualquier día...", type: "medium", pos: [-40, 15, -20] },
            { text: "...y tú eres una de esas personas", type: "medium", pos: [-35, 5, -25] },
            
            // Dandelions Lyrics
            { text: "'Cause I'm in a field of dandelions...", type: "small", pos: [20, -45, 0] },
            { text: "Wishing on every one that you'd be mine...", type: "small", pos: [-20, 10, 25] },
            
            { text: "Si pudiera, llenaría tu habitación de flores amarillas", type: "small", pos: [25, 20, 10] },
            { text: "Por ahora, te envío estas", type: "small", pos: [15, 35, -5] },
            { text: "Una flor por cada vez que pienso en ti", type: "small", pos: [-30, 30, 5] },
            { text: "Te quiero muchísimo, niña", type: "small", pos: [0, 40, -20] },
            { text: "La distancia no impide enviar un poquito de cariño", type: "small", pos: [35, 25, -25] },
            { text: "Porque te mereces algo bonito", type: "small", pos: [-45, 0, 5] }
        ];

        // Emojis/Imágenes de Flores
        const icons = [
            { icon: "🌻", size: "80px", pos: [35, -10, 25] }, 
            { icon: "💐", size: "60px", pos: [-30, 5, 30] },  
            { icon: "🌻", size: "40px", pos: [-15, -15, 20] },
            { icon: "💐", size: "50px", pos: [10, -20, 35] },
            { icon: "🌻", size: "30px", pos: [20, 15, -15] },
            { icon: "🌻", size: "45px", pos: [-25, 20, -10] },
            { icon: "💐", size: "40px", pos: [30, -25, 5] },
            { icon: "🌻", size: "25px", pos: [5, 30, 15] },
            { icon: "🌻", size: "35px", pos: [-10, -35, 5] },
            // LA FLOR SECRETA (Un poco escondida)
            { icon: "🌻", size: "55px", pos: [0, -50, -10], isSecret: true }
        ];

        // Mensajes al hacer click en las flores normales
        const clickMessages = [
            "🌻 Esta flor es para ti.",
            "🌻 Una más para mi niña.",
            "🌻 Porque te quiero mucho.",
            "🌻 Guarda esta flor.",
            "🌻 Para alegrarte el día."
        ];

        const raycaster = new THREE.Raycaster();
        const htmlElements = [];

        // Función para agregar textos e íconos (y detectar la flor secreta)
        function addHtmlElement(content, type, size, position, isIcon = false, isSecret = false) {
            const el = document.createElement('div');
            el.innerHTML = content;
            
            if (isIcon) {
                el.className = 'floating-icon';
                el.style.fontSize = size;
                
                if (isSecret) {
                    // Evento para la flor secreta
                    el.addEventListener('click', (e) => {
                        triggerSecretMessage();
                    });
                } else {
                    // Evento normal
                    el.addEventListener('click', (e) => {
                        const msg = clickMessages[Math.floor(Math.random() * clickMessages.length)];
                        showToast(e.clientX, e.clientY, msg);
                    });
                }
            } else {
                el.className = `floating-label label-${type}`;
            }

            labelsContainer.appendChild(el);
            htmlElements.push({
                element: el,
                pos: new THREE.Vector3(position[0], position[1], position[2]),
                isIcon: isIcon,
                isPhoto: false
            });
        }

        // Función para agregar las 3 FOTOS
        function addPhotoElement(imgSrc, position, rotationDeg, clickMsg) {
            const el = document.createElement('div');
            el.className = 'photo-wrapper';
            el.innerHTML = `<img src="${imgSrc}" style="transform: rotate(${rotationDeg}deg);">`;
            
            labelsContainer.appendChild(el);
            
            htmlElements.push({
                element: el,
                pos: new THREE.Vector3(position[0], position[1], position[2]), 
                isIcon: false,
                isPhoto: true
            });
            
            el.addEventListener('click', (e) => {
                showToast(e.clientX, e.clientY, clickMsg);
            });
        }

        // Crear textos y flores
        texts.forEach(item => addHtmlElement(item.text, item.type, null, item.pos, false));
        icons.forEach(item => addHtmlElement(item.icon, null, item.size, item.pos, true, item.isSecret));
        
        // AGREGAR LAS 3 FOTOS (foto1, foto2, foto3)
        // foto1.jpeg (Daniel)
        addPhotoElement('foto1.jpeg', [25, 20, 20], -5, "❤️ Siempre pensando en ti"); 
        // foto2.jpeg (Pug con sombrero)
        addPhotoElement('foto2.jpeg', [-30, -15, 25], 8, "😂 ¡Mira esta ternura!");
        // foto3.jpeg (Aleja)
        addPhotoElement('foto3.jpeg', [15, -25, -15], -10, "✨ Mi niña hermosa");

        // Función del Mensaje Secreto
        function triggerSecretMessage() {
            if(secretFound) return;
            secretFound = true;
            
            const overlay = document.getElementById('secret-overlay');
            const sec1 = document.getElementById('sec-1');
            const sec2 = document.getElementById('sec-2');
            const sec3 = document.getElementById('sec-3');
            const sec4 = document.getElementById('sec-4');

            overlay.style.pointerEvents = 'auto';
            overlay.style.opacity = '1';
            
            // Aumentar brillo del planeta de fondo
            ringMat.color.setHex(0xFFFFFF);
            
            setTimeout(() => { sec1.style.opacity = '1'; }, 1000);
            setTimeout(() => { sec1.style.opacity = '0'; }, 4000);
            
            setTimeout(() => { sec2.style.opacity = '1'; }, 5500);
            setTimeout(() => { sec2.style.opacity = '0'; }, 8500);
            
            setTimeout(() => { sec3.style.opacity = '1'; }, 10000);
            setTimeout(() => { sec3.style.opacity = '0'; }, 14000);
            
            setTimeout(() => { sec4.style.opacity = '1'; }, 15500);
            
            // Opcional: Cerrar después de un tiempo o dejarlo en pantalla
            setTimeout(() => { 
                overlay.style.opacity = '0'; 
                overlay.style.pointerEvents = 'none';
                sec4.style.opacity = '0';
                ringMat.color.setHex(0xFFFFFF); // Regresar al color normal
                secretFound = false; // Permitir volver a descubrirlo
            }, 21000);
        }

        const tempV = new THREE.Vector3();
        function updateLabelsPosition() {
            htmlElements.forEach(item => {
                tempV.copy(item.pos);
                
                raycaster.setFromCamera(tempV.clone().project(camera), camera);
                const intersects = raycaster.intersectObject(planet);
                
                let isObstructed = false;
                if (intersects.length > 0) {
                    if (intersects[0].distance < camera.position.distanceTo(item.pos)) {
                        isObstructed = true;
                    }
                }

                tempV.project(camera);

                if (tempV.z > 1 || isObstructed) {
                    item.element.style.opacity = '0';
                    item.element.style.pointerEvents = 'none';
                } else {
                    item.element.style.opacity = '1';
                    item.element.style.pointerEvents = 'auto';
                    
                    const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (tempV.y * -0.5 + 0.5) * window.innerHeight;
                    
                    const time = Date.now() * 0.001;
                    const floatX = Math.sin(time + item.pos.x) * 5;
                    const floatY = Math.cos(time + item.pos.y) * 5;

                    item.element.style.transform = `translate(-50%, -50%) translate(${x + floatX}px, ${y + floatY}px)`;
                    
                    const scale = Math.max(0.3, 1 - (camera.position.distanceTo(item.pos) / 300));
                    item.element.style.transform += ` scale(${scale})`;
                }
            });
        }

        function showToast(x, y, text) {
            const toast = document.getElementById('toast-message');
            toast.innerText = text;
            toast.style.left = `${x}px`;
            toast.style.top = `${y}px`;
            
            toast.classList.remove('show');
            void toast.offsetWidth; 
            toast.classList.add('show');
            
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Inicio interactivo - Corrección robusta de audio
        introScreen.addEventListener('click', () => {
            if (isStarted) return; 
            isStarted = true;
            introScreen.style.pointerEvents = 'none'; 

            const playPromise = music.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isMusicPlaying = true;
                    musicBtn.innerText = '🎵';
                }).catch(e => {
                    console.log("Audio bloqueado o no encontrado:", e);
                    musicBtn.innerText = '🔇';
                    isMusicPlaying = false;
                    showToast(window.innerWidth / 2, window.innerHeight - 100, "⚠️ Asegúrate de tener dandelions.mp3 en la carpeta");
                });
            }

            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
            }, 1500);
        });

        // Botón de música
        musicBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                music.pause();
                isMusicPlaying = false;
                musicBtn.innerText = '🔇';
            } else {
                const playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isMusicPlaying = true;
                        musicBtn.innerText = '🎵';
                    }).catch(e => {
                        console.log("Error al reproducir:", e);
                        isMusicPlaying = false;
                        showToast(window.innerWidth / 2, window.innerHeight - 100, "⚠️ Verifica el archivo dandelions.mp3");
                    });
                }
            }
        });

        // Bucle de renderizado
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            ring.rotation.z += 0.001;

            if (isStarted && !secretFound) {
                updateLabelsPosition();
            }

            renderer.render(scene, camera);
        }

        animate();

    </script>
